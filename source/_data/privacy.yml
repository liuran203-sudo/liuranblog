updated: 2024-7-5

sections:
  - title: 隐私政策
    content: |
      本站非常重视用户的隐私和个人信息保护。你在使用网站时，可能会收集和使用你的相关信息。通过《隐私政策》向你说明在你访问 blog.anheyu.com 网站时，如何收集、使用、保存、共享和转让这些信息。

  - title: 一、在访问时如何收集和使用你的个人信息
    subsections:
      - title: 在访问时，收集访问信息的服务会收集不限于以下信息：
        list:
          - 网络身份标识信息（浏览器 UA、IP 地址）
          - 设备信息
          - 浏览过程（操作方式、浏览方式与时长、性能与网络加载情况）
      - title: 在访问时，本站内置的第三方服务会通过以下或更多途径，来获取你的以下或更多信息：
        list:
          - "**腾讯云** 会收集你的访问信息，用于提供网站基础服务与网站加速服务。腾讯云隐私政策"
          - "**网易云音乐** 会收集你的访问信息，用于胶囊音乐的展示与播放。网易云音乐隐私保护指引"
      - title: 在访问时，本人仅会处于以下目的，使用你的个人信息：
        list:
          - 恶意访问识别，用于维护网站
          - 恶意攻击排查，用于维护网站
          - 网站点击情况监测，用于优化网站页面布局方式
          - 网站加载情况监测，用于优化网站性能
          - 网站访问来源及访问路径，用于网站搜索结果优化
          - 网站访问请求情况，用于热度数据的展示

  - title: 二、在评论时如何收集和使用你的个人信息
    content: |
      评论使用的是无登陆系统的匿名评论系统，你可以自愿填写真实的、或者虚假的信息作为你评论的展示信息。
      在你评论时，会额外收集你的详细个人与设备信息进行存储，用于鉴别恶意用户。
    subsections:
      - title: 在访问时，本人仅会处于以下目的，收集并使用以下信息：
        list:
          - 评论时会记录你的 QQ 账号（如果在邮箱位置填写 QQ 邮箱或 QQ 号），方便获取你的 QQ 头像。（主动，存储）
          - 评论时会记录你的邮箱，当我回复后会通过邮件通知你（主动，存储，不会公开邮箱）
          - 评论时会记录你的网址，用于点击头像时快速进入你的网站（主动，存储）
          - 评论时会记录你的 IP 地址，作为反垃圾的用户判别依据（被动，存储，不会公开 IP，会公开 IP 所在城市）
          - 评论会记录你的浏览器代理，用作展示系统版本、浏览器版本方便展示你使用的设备，快速定位问题（被动，存储）

  - title: 三、如何使用 Cookies 和本地 LocalStorage 存储
    content: |
      本站为实现无账号评论、深色模式切换，不蒜子的 uv 统计等功能，会在你的浏览器中进行本地存储，
      你可以随时清除浏览器中保存的所有 Cookies 以及 LocalStorage，不影响你的正常使用。

  - title: 四、如何共享、转让你的个人信息
    list:
      - 本人不会与任何公司、组织和个人共享你的隐私信息
      - 本人不会将你的个人信息转让给任何公司、组织和个人
      - 第三方服务的共享、转让情况详见对应服务的隐私协议

  - title: 五、附属协议
    content: |
      当监测到存在恶意访问、恶意请求、恶意攻击、恶意评论的行为时，为了防止增大受害范围，
      可能会临时将你的 IP 地址及访问信息短期内添加到黑名单，短期内禁止访问。